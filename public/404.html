<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#f8f7f3" />
    <title>Page Not Found | The Little Big Experience</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "DM Sans", "Segoe UI", sans-serif;
        color: #26231f;
        background: #f8f7f3;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(100% - 48px, 880px);
        padding: 96px 0;
      }
      .eyebrow {
        color: #997144;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }
      h1 {
        max-width: 760px;
        margin: 28px 0 0;
        font-family: Georgia, serif;
        font-size: clamp(48px, 8vw, 92px);
        font-weight: 400;
        line-height: 0.98;
      }
      p {
        max-width: 540px;
        margin: 28px 0 0;
        color: #68645e;
        font-size: 17px;
        line-height: 1.7;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 40px;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border: 1px solid #b7b0a5;
        color: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:first-child {
        border-color: #26231f;
        background: #26231f;
        color: #fff;
      }
      a:hover {
        border-color: #997144;
      }
      a:focus-visible {
        outline: 3px solid #997144;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">The Little Big Experience · 404</div>
      <h1>That page couldn't be found.</h1>
      <p>
        The page may have moved, or the address may be incorrect. Find your way back to an
        experience or get in touch with us.
      </p>
      <nav aria-label="Page not found navigation">
        <a href="/">Home</a>
        <a href="/experiences">Explore Experiences</a>
        <a href="/contact">Contact Us</a>
      </nav>
    </main>
  </body>
</html>
